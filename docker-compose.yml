services:
  api:
    build: .
    environment:
      BRS_MODEL: ${BRS_MODEL:-baseline}
      BRS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

